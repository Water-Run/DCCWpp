  <rect x="173" y="411" width="166" height="9" rx="2" fill="url(#foot)"/>
  <rect x="55" y="91" width="402" height="286" rx="11" fill="#455966"/>
  <rect x="57" y="93" width="398" height="282" rx="9" stroke="#A1B5C0" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="61" y="97" width="390" height="274" rx="5.5" fill="url(#screen)"/>
