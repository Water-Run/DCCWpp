<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>DCCW++</title>
  <desc>A thin front-facing Windows 11 style display with a blue gradient screen and a single spectral calibration cube.</desc>
  <defs>
    <linearGradient id="screen" x1="82" y1="110" x2="424" y2="362" gradientUnits="userSpaceOnUse"><stop stop-color="#3CE2E6"/><stop offset=".52" stop-color="#13A9DF"/><stop offset="1" stop-color="#0867C7"/></linearGradient>
    <linearGradient id="stem" x1="232" y1="371" x2="280" y2="417" gradientUnits="userSpaceOnUse"><stop stop-color="#A2B1BC"/><stop offset="1" stop-color="#D3DDE4"/></linearGradient>
    <linearGradient id="foot" x1="256" y1="411" x2="256" y2="423" gradientUnits="userSpaceOnUse"><stop stop-color="#EBF0F3"/><stop offset="1" stop-color="#A7B5BF"/></linearGradient>
    <linearGradient id="cubeTop" x1="177" y1="190" x2="331" y2="223" gradientUnits="userSpaceOnUse"><stop stop-color="#29E7F4"/><stop offset="1" stop-color="#72F752"/></linearGradient>
    <linearGradient id="cubeLeft" x1="178" y1="225" x2="255" y2="323" gradientUnits="userSpaceOnUse"><stop stop-color="#099CFC"/><stop offset=".55" stop-color="#7254F6"/><stop offset="1" stop-color="#BB2CF2"/></linearGradient>
    <linearGradient id="cubeRight" x1="300" y1="218" x2="288" y2="322" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF763"/><stop offset=".52" stop-color="#FFAF58"/><stop offset="1" stop-color="#FF597C"/></linearGradient>
  </defs>
  <path d="M233 370h46v45h-46z" fill="url(#stem)"/>
