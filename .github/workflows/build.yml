name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build and verify release evidence
        shell: pwsh
        run: python scripts/build_release_evidence.py ci --commit "$env:GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: DCCWPlus-development-evidence
          if-no-files-found: error
          compression-level: 0
          path: |
            artifacts/release-evidence/ci/DCCWPlus-source.zip
            artifacts/release-evidence/ci/evidence.json
            artifacts/release-evidence/ci/packages/*.msix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: DCCWPlus-build-logs
          path: artifacts/release-evidence/ci/logs/*.log
  runtime:
    name: Windows ${{ matrix.label }} package runtime
    needs: windows
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            label: x64
            runner: windows-2025
          - architecture: arm64
            label: ARM64
            runner: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DCCWPlus-development-evidence
          path: artifacts/release-evidence/runtime-input
      - name: Install and run the development package
        shell: pwsh
        run: >-
          ./scripts/Test-DevelopmentPackage.ps1
          -Architecture '${{ matrix.architecture }}'
          -EvidenceDirectory artifacts/release-evidence/runtime-input
          -ReportPath artifacts/release-evidence/${{ matrix.architecture }}-runtime.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: DCCWPlus-${{ matrix.architecture }}-runtime
          path: artifacts/release-evidence/${{ matrix.architecture }}-runtime.json
